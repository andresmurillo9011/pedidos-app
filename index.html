<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DomiApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; color: #1a1a2e; }
    a { text-decoration: none; color: inherit; }
    button { cursor: pointer; font-family: inherit; }

    /* NAV */
    nav {
      background: #1a56db;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo { color: #fff; font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 8px; }
    .nav-links { display: flex; align-items: center; gap: 8px; }
    .nav-link { color: #c7d7ff; font-size: 14px; padding: 6px 14px; border-radius: 8px; transition: background .2s; }
    .nav-link:hover { background: rgba(255,255,255,.15); color: #fff; }
    .nav-btn { background: #fff; color: #1a56db; border: none; border-radius: 8px; padding: 7px 16px; font-size: 14px; font-weight: 600; }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #1a56db, #1e40af);
      padding: 48px 24px;
      text-align: center;
      color: #fff;
    }
    .hero h1 { font-size: 32px; font-weight: 700; margin-bottom: 10px; }
    .hero p { font-size: 16px; opacity: .85; margin-bottom: 24px; }
    .search-bar {
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      gap: 8px;
      background: #fff;
      border-radius: 12px;
      padding: 6px 6px 6px 16px;
    }
    .search-bar input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      color: #1a1a2e;
      background: transparent;
    }
    .search-bar button {
      background: #1a56db;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 20px;
      font-size: 14px;
      font-weight: 600;
    }

    /* CATEGORÍAS */
    .section { max-width: 1000px; margin: 0 auto; padding: 28px 16px; }
    .section-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; color: #1a1a2e; }
    .cats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .cat-btn {
      padding: 8px 18px;
      border-radius: 20px;
      border: 1.5px solid #c7d7ff;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #1a56db;
      transition: all .2s;
    }
    .cat-btn:hover, .cat-btn.active {
      background: #1a56db;
      color: #fff;
      border-color: #1a56db;
    }

    /* TIENDAS */
    .stores-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }
    .store-card {
      background: #fff;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #e0e7ff;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s;
    }
    .store-card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(26,86,219,.12); }
    .store-banner {
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      background: #e0e7ff;
    }
    .store-body { padding: 12px 14px; }
    .store-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .store-meta { display: flex; justify-content: space-between; align-items: center; }
    .store-cat { font-size: 12px; color: #6b7280; }
    .badge-open  { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: #d1fae5; color: #065f46; }
    .badge-close { font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 20px; background: #fee2e2; color: #991b1b; }

    /* VACÍO */
    .empty { grid-column: 1/-1; text-align: center; padding: 40px; color: #9ca3af; font-size: 15px; }

    /* FOOTER */
    footer { text-align: center; padding: 24px; font-size: 13px; color: #9ca3af; border-top: 1px solid #e0e7ff; margin-top: 32px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">🛵 DomiApp</div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">Inicio</a>
    <a href="carrito.html" class="nav-link">🛍 Carrito</a>
    <a href="login.html"><button class="nav-btn">Mi cuenta</button></a>
  </div>
</nav>

<div class="hero">
  <h1>¿Qué necesitas hoy?</h1>
  <p>Pedidos a domicilio desde tus tiendas favoritas</p>
  <div class="search-bar">
    <input type="text" id="buscador" placeholder="Buscar tiendas o productos..." oninput="filtrar()" />
    <button onclick="filtrar()">Buscar</button>
  </div>
</div>

<div class="section">
  <div class="cats" id="categorias">
    <button class="cat-btn active" onclick="setCategoria('Todas', this)">🏪 Todas</button>
    <button class="cat-btn" onclick="setCategoria('Minimercado', this)">🛒 Mercado</button>
    <button class="cat-btn" onclick="setCategoria('Comida', this)">🍔 Comida</button>
    <button class="cat-btn" onclick="setCategoria('Farmacia', this)">💊 Farmacia</button>
    <button class="cat-btn" onclick="setCategoria('Licores', this)">🍺 Licores</button>
    <button class="cat-btn" onclick="setCategoria('Mascotas', this)">🐾 Mascotas</button>
  </div>

  <div class="section-title">Tiendas cerca de ti</div>
  <div class="stores-grid" id="stores-grid"></div>
</div>

<footer>© 2026 DomiApp · Todos los derechos reservados</footer>

<script>
  const API = 'https://domiapp-backend.onrender.com'; // cambia por tu URL de Render
  const TOKEN = localStorage.getItem('token');

  const tiendas = [
    { id:1, nombre:'Tienda El Punto',     categoria:'Minimercado', distancia:'0.4 km', abierta:true,  emoji:'🏪' },
    { id:2, nombre:'La Fogata',           categoria:'Comida',      distancia:'0.8 km', abierta:true,  emoji:'🍔' },
    { id:3, nombre:'Droguería Central',   categoria:'Farmacia',    distancia:'1.2 km', abierta:false, emoji:'💊' },
    { id:4, nombre:'Licores El Rey',      categoria:'Licores',     distancia:'0.6 km', abierta:true,  emoji:'🍺' },
    { id:5, nombre:'Pet Shop La Huella',  categoria:'Mascotas',    distancia:'1.5 km', abierta:true,  emoji:'🐾' },
    { id:6, nombre:'Comidas Doña Rosa',   categoria:'Comida',      distancia:'0.3 km', abierta:true,  emoji:'🫕' },
  ];

  let categoriaActiva = 'Todas';

  function setCategoria(cat, btn) {
    categoriaActiva = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTiendas();
  }

  function filtrar() { renderTiendas(); }

  function renderTiendas() {
    const busqueda = document.getElementById('buscador').value.toLowerCase();
    const grid = document.getElementById('stores-grid');

    const filtradas = tiendas.filter(t => {
      const matchCat  = categoriaActiva === 'Todas' || t.categoria === categoriaActiva;
      const matchBusq = t.nombre.toLowerCase().includes(busqueda);
      return matchCat && matchBusq;
    });

    if (filtradas.length === 0) {
      grid.innerHTML = '<div class="empty">No encontramos tiendas con ese filtro.</div>';
      return;
    }

    grid.innerHTML = filtradas.map(t => `
      <div class="store-card" onclick="irATienda(${t.id})">
        <div class="store-banner">${t.emoji}</div>
        <div class="store-body">
          <div class="store-name">${t.nombre}</div>
          <div class="store-meta">
            <span class="store-cat">${t.categoria} · ${t.distancia}</span>
            <span class="${t.abierta ? 'badge-open' : 'badge-close'}">${t.abierta ? '● Abierta' : '● Cerrada'}</span>
          </div>
        </div>
      </div>
    `).join('');
  }

  function irATienda(id) {
    window.location.href = `tienda.html?id=${id}`;
  }

  renderTiendas();
</script>

</body>
</html>
